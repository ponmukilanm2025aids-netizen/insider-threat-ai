services:
  - type: web
    name: cybersentry-ai-soc
    runtime: python
    buildCommand: "pip install -r requirements.txt && python main.py --generate --features --train"
    startCommand: "uvicorn src.api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PYTHONPATH
        value: .
