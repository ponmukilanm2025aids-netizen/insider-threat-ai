version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ayursutra_postgres
    restart: always
    environment:
      POSTGRES_USER: ayursutra_user
      POSTGRES_PASSWORD: ayursutra_password
      POSTGRES_DB: ayursutra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayursutra_user -d ayursutra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ayursutra_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://ayursutra_user:ayursutra_password@db:5432/ayursutra_db
      SECRET_KEY: ayursutra_super_secure_jwt_secret_key_ayush_sih_2026_production
      PROJECT_NAME: AyurSutra - Panchakarma Patient Management System
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ayursutra_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
